name: Preordini scaduti v2 (auto-esaurito)

# -----------------------------------------------------------------------------
# COSA FA:
#   FLUSSO NUOVO, affianca quello vecchio (preordini_scaduti.yml) senza
#   sostituirlo. Ogni lunedì alle 06:30 UTC — mezz'ora PRIMA del vecchio —
#   chiama la HTTP function Velo `runPreorderJobV2` sul sito Wix, che mette in
#   ESAURITO i preordini scaduti (se sul sito MODALITA = 'APPLICA') e manda la
#   mail di riepilogo.
#
# PERCHÉ PIÙ CHIAMATE:
#   Wix interrompe una HTTP function dopo ~60 secondi (errore 504). Per questo
#   il sito lavora al massimo 6 prodotti per chiamata e qui richiamiamo la
#   funzione finché "rimandatiCount" non arriva a 0 (max 10 chiamate).
#   Nei lunedì con molti preordini scaduti arrivano quindi 2-3 mail v2.
#   Un 504 isolato viene ritentato una volta dopo 30 secondi.
#
# CHIAVE SEGRETA:
#   Header "x-cxt-key" preso dal secret GitHub PREORDER_JOB_KEY, identico al
#   secret Wix con lo stesso nome. Senza chiave valida Wix non modifica nulla.
#
# TEST SU UN SINGOLO PRODOTTO (tab Actions → Run workflow):
#   - product_id: l'ID Wix del prodotto
#   - apply: spunta per metterlo DAVVERO in esaurito (altrimenti prova a secco)
#   In questo caso la mail non parte: il risultato è nel log qui sotto.
# -----------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      product_id:
        description: 'Test: ID di UN solo prodotto (vuoto = giro completo)'
        required: false
        default: ''
      apply:
        description: 'Test: applica davvero la modifica al prodotto indicato'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '30 6 * * 1'    # ogni lunedì alle 06:30 UTC (il vecchio parte alle 07:00)

jobs:
  call-wix-job:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama runPreorderJobV2 su Wix
        env:
          JOB_KEY: ${{ secrets.PREORDER_JOB_KEY }}
          PRODUCT_ID: ${{ github.event.inputs.product_id }}
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          set -euo pipefail

          ENDPOINT="https://www.collezionismopertutti.com/_functions/runPreorderJobV2"
          MAX_CHIAMATE=10

          # Test su singolo prodotto: una sola chiamata
          if [ -n "${PRODUCT_ID:-}" ]; then
            if ! [[ "$PRODUCT_ID" =~ ^[A-Za-z0-9-]+$ ]]; then
              echo "::error::product_id non valido"
              exit 1
            fi
            ENDPOINT="$ENDPOINT?only=$PRODUCT_ID"
            if [ "${APPLY:-false}" = "true" ]; then
              ENDPOINT="$ENDPOINT&apply=1"
            fi
            MAX_CHIAMATE=1
          fi

          chiama() {
            curl -sS \
              --max-time 180 \
              -H "Accept: application/json" \
              -H "x-cxt-key: ${JOB_KEY:-}" \
              -o /tmp/body.txt \
              -w "%{http_code}" \
              "$ENDPOINT"
          }

          errori_totali=0
          rimandati=0
          for n in $(seq 1 "$MAX_CHIAMATE"); do
            echo "→ Chiamata $n a $ENDPOINT"
            http_code=$(chiama || true)

            # 504 = Wix ha interrotto la funzione per tempo: riprovo una volta
            if [ "$http_code" = "504" ]; then
              echo "⚠️  Wix ha risposto 504 (timeout): riprovo tra 30 secondi"
              sleep 30
              http_code=$(chiama || true)
            fi

            echo "HTTP status: $http_code"
            echo "----- Response body -----"
            cat /tmp/body.txt || true
            echo
            echo "-------------------------"

            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "::error::Wix function ha risposto $http_code (atteso 2xx)"
              exit 1
            fi

            errori=$(grep -o '"erroriCount":[0-9]*' /tmp/body.txt | grep -o '[0-9]*$' || echo 0)
            rimandati=$(grep -o '"rimandatiCount":[0-9]*' /tmp/body.txt | grep -o '[0-9]*$' || echo 0)
            errori_totali=$((errori_totali + errori))
            echo "Errori in questa chiamata: $errori · rimandati: $rimandati"

            if [ "$rimandati" = "0" ]; then
              break
            fi
            sleep 5
          done

          if [ "$rimandati" != "0" ]; then
            echo "::error::Dopo $MAX_CHIAMATE chiamate restano ancora $rimandati prodotti da lavorare"
            exit 1
          fi

          if [ "$errori_totali" -gt 0 ]; then
            echo "::error::$errori_totali prodotti non sono stati aggiornati (vedi esiti sopra)"
            exit 1
          fi

          echo "✅ Job preordini scaduti v2 completato."
