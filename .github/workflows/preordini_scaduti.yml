name: Lancia job preordini scaduti

on:
  workflow_dispatch:        # puoi avviarlo a mano
  schedule:
    - cron: '0 7 * * 1'     # ogni lunedì alle 07:00 UTC (~ 08:00 italiane)

jobs:
  call-wix-job:
    runs-on: ubuntu-latest

    steps:
      - name: Chiama runPreorderJob su Wix
        run: |
          curl -s https://www.collezionismopertutti.com/_functions/runPreorderJob
